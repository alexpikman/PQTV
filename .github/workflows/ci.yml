name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Integrity tests
        run: bun run test
      - name: PostgreSQL persistence tests
        run: bun run test:postgres
      - name: Firestore Rules tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-pqtv "bun run test:rules"
