<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Диагональный градиент: расширенный фиолетово-сине-голубой -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E4E"/>
      <stop offset="25%" stop-color="#673AB7"/>
      <stop offset="55%" stop-color="#311B92"/>
      <stop offset="80%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>

    <!-- Мягкое свечение / тень -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Фон баннера Android TV (точно 16:9, 320x180) -->
  <rect width="320" height="180" rx="20" ry="20" fill="url(#bgGradient)"/>

  <g filter="url(#glow)">
    <!-- Широкоформатный корпус телевизора (пропорция 16:9) -->
    <!-- Занимает ширину 260px (от 30 до 290) и высоту 110px (от 35 до 145) -->
    <rect x="30" y="35" width="260" height="110" rx="12" ry="12" stroke="#FFFFFF" stroke-width="7" fill="none"/>

    <!-- Антенны над телевизором -->
    <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="145" y1="12" x2="160" y2="35" stroke-width="3"/>
      <circle cx="144" cy="10" r="2.5" fill="#FFFFFF" stroke="none"/>

      <line x1="175" y1="12" x2="160" y2="35" stroke-width="3"/>
      <circle cx="176" cy="10" r="2.5" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Полочка (подставка) под телевизором -->
    <line x1="130" y1="158" x2="190" y2="158" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Крупный текст PQTV внутри экрана -->
    <text x="160" y="102" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="5">PQTV
</text></g></svg>